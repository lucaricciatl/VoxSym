name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -v

      - name: Smoke imports
        run: python -c "from voxsym import VoxSym; VoxSym(backend=None); print('ok')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Install npm deps
        run: cd voxsym/web/frontend && npm ci

      - name: Build frontend
        run: cd voxsym/web/frontend && npm run build

      - name: Install Playwright
        run: cd voxsym/web/frontend && npx playwright install chromium

      - name: Run Playwright tests
        run: cd voxsym/web/frontend && npx playwright test e2e/
