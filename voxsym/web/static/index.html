<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>VoxSym WebGL</title>
  <link rel="stylesheet" href="css/main.css?v=6">
</head>
<body>
  <header id="topbar">
    <div class="tb-left">
      <button id="tb-play" class="icon-btn" title="Play / Pause">▶</button>
      <button id="tb-reset" class="icon-btn" title="Reset">↺</button>
      <button id="tb-stop" class="icon-btn" title="Stop">⏹</button>
      <span id="time-display" class="time-badge">t = 0.000 s</span>
      <span id="status" class="status-badge">connecting…</span>
    </div>
    <div class="tb-right">
      <button id="tb-record" class="icon-btn record" title="Record canvas">●</button>
      <button id="tb-help" class="icon-btn" title="Help">?</button>
    </div>
  </header>

  <nav id="iconbar">
    <button data-panel="layers" class="active" title="Layers">🎨</button>
    <button data-panel="display" title="Display">⚙️</button>
    <button data-panel="slicing" title="Cross section">✂️</button>
    <button data-panel="recording" title="Recording">💾</button>
  </nav>

  <aside id="side-panel" class="panel"></aside>

  <div id="viewport"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/": "https://unpkg.com/three@0.160.0/"
    }
  }
  </script>
  <script type="module" src="js/main.js?v=7"></script>
</body>
</html>
